name: Feature / Task
description: Propose a feature or a unit of planned work
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be achieved and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: files
    attributes:
      label: Files / Folders to Touch
      description: Which files or folders this work will change. The coordinator uses this to spot two tasks colliding.
      placeholder: |
        - src/sun/
        - docs/adr/0003-sun-api.md
  - type: textarea
    id: notes
    attributes:
      label: Notes / Design
      description: Technical notes, mockups, links
