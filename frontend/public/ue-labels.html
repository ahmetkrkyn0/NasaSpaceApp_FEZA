<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unreal labels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Unreal'in saydam, tiklanamaz ikinci tarayicisi bu sayfayi yukler (feza_runtime.py -> window.feza.set(veri)).
  Etiketler HTML/CSS ile cizilir: cam efektli kartlar, ince yonlendirme cizgileri, rozetler.
  Veri: { items: [{id, kind: body|site, x, y, cx, cy, r, title, sub, chip, accent: moon|earth|sat, hot}], head: {title, sub, accent} | null }
  Koordinatlar CSS pikseli (Unreal tarafi DPI'ye bolup gonderir).
-->
<style>
  :root {
    --ink: #e7eaf1; --muted: #98a1b4; --card: rgba(9, 13, 21, 0.74); --line: rgba(130, 148, 196, 0.38);
    --moon: #ffb457; --earth: #5ad1ff; --sat: #b9aaff;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--ink);
    font: 12px/1.35 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  #layer { position: fixed; inset: 0; pointer-events: none; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  svg line { stroke: var(--line); stroke-width: 1; }
  .acc-moon { --accent: var(--moon); } .acc-earth { --accent: var(--earth); } .acc-sat { --accent: var(--sat); }
  .lbl { position: absolute; left: 0; top: 0; will-change: transform, opacity; opacity: 0; transition: opacity .22s ease; }
  .lbl.on { opacity: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 9px; white-space: nowrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 2px;
    backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex: none; }
  .pill b { font-weight: 600; letter-spacing: .05em; font-size: 12px; text-transform: uppercase; }
  .chip { font: 600 10px/1 'Cascadia Mono', Consolas, ui-monospace, monospace; letter-spacing: .06em; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); padding: 3px 5px 2px; border-radius: 2px; text-transform: uppercase; }
  .sub { margin-top: 4px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .coord { font: 11px/1 'Cascadia Mono', Consolas, ui-monospace, monospace; color: var(--muted); }
  .body { transform-origin: 50% 100%; }
  .body .sub { text-align: center; }
  .site .pill, .site .card { width: 262px; box-sizing: border-box; }
  .body .pill { min-width: 190px; }
  .site .card { display: block; margin-top: 3px; padding: 7px 11px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 2px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 32px rgba(0, 0, 0, .55); }
  .site .info, .site .hint, .site .meta { display: none; }
  .site.hot .info, .site.hot .hint, .site.hot .meta { display: block; }
  .info { margin-top: 6px; color: var(--ink); font-size: 11.5px; line-height: 1.4; white-space: normal; max-width: 240px; }
  .meta { margin-top: 4px; font: 600 10px/1 'Cascadia Mono', Consolas, monospace; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .pill b { flex: 1; }
  .flag { width: 20px; height: 13px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.25); display: none; background-size: cover; }
  .sub1 { color: var(--ink); font-size: 11.5px; }
  .site.hot .pill { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 8px 28px rgba(0, 0, 0, .5); }
  .card .hint { margin-top: 7px; color: var(--accent); font-size: 11px; }
  #panel { position: absolute; left: 0; top: 0; background: rgba(4, 6, 11, .97); display: none; }
  #map { position: absolute; display: none; border: 1px solid var(--line); border-radius: 2px; background-size: 100% 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); overflow: hidden; }
  #map::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, rgba(160, 180, 230, .16) 1px, transparent 1px), linear-gradient(to bottom, rgba(160, 180, 230, .16) 1px, transparent 1px);
    background-size: 8.3333% 16.6667%; }
  .dot { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--accent); background: rgba(0, 0, 0, .45);
    box-shadow: 0 0 12px var(--accent); pointer-events: none; }
  .dot.hot { background: var(--accent); transform-origin: center; }
  #toggle { position: absolute; left: 28px; padding: 6px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 2px; font: 600 11px/1 'Cascadia Mono', Consolas, monospace;
    letter-spacing: .1em; color: var(--ink); text-transform: uppercase; opacity: 0; transition: opacity .25s; backdrop-filter: blur(10px); }
  #toggle.on { opacity: 1; } #toggle.hot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #head { position: absolute; left: 28px; top: 24px; max-width: 360px; padding: 10px 14px 12px; background: var(--card); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 2px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 32px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; }
  #head.on { opacity: 1; transform: none; }
  #head h1 { margin: 0 0 3px; font-size: 13px; letter-spacing: .12em; font-weight: 600; }
  #head p { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="layer"><div id="panel"></div><div id="map"></div><svg id="lines"></svg><div id="head"><h1></h1><p></p></div><div id="toggle"></div></div>
<script>
(function () {
  window.onerror = function (m, s, l) { console.log("ERR " + m + " @" + l); };
  var layer = document.getElementById('layer'), lines = document.getElementById('lines'), head = document.getElementById('head');
  var nodes = {}, pos = {}, dots = {}, lastLay = '';
  var panel = document.getElementById('panel'), mapEl = document.getElementById('map'), tgl = document.getElementById('toggle');

  function svg(b) { return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">' + b + '</svg>'); }
  var FLAGS = {
    us: svg('<rect width="30" height="20" fill="#fff"/>' + [0,2,4,6,8,10,12].map(function (i) { return '<rect y="' + (i * 20 / 13).toFixed(2) + '" width="30" height="' + (20 / 13).toFixed(2) + '" fill="#b22234"/>'; }).join('') + '<rect width="13" height="10.8" fill="#3c3b6e"/>'),
    es: svg('<rect width="30" height="20" fill="#c60b1e"/><rect y="5" width="30" height="10" fill="#ffc400"/>'),
    au: svg('<rect width="30" height="20" fill="#012169"/><rect width="14" height="10" fill="#012169"/><path d="M0 0L14 10M14 0L0 10" stroke="#fff" stroke-width="2"/><path d="M7 0V10M0 5H14" stroke="#fff" stroke-width="3.4"/><path d="M7 0V10M0 5H14" stroke="#c8102e" stroke-width="1.8"/><g fill="#fff"><circle cx="7" cy="15" r="1.7"/><circle cx="21" cy="4" r="1.2"/><circle cx="25" cy="9" r="1.2"/><circle cx="21" cy="15" r="1.2"/><circle cx="17" cy="9" r="1.2"/></g>')
  };
  function mk(it) {
    var d = document.createElement('div');
    d.className = 'lbl ' + it.kind + ' acc-' + it.accent;
    var chip = '<span class="chip"></span>';
    if (it.kind === 'body') {
      d.innerHTML = '<div class="pill"><i></i><b></b>' + chip + '</div><div class="sub"></div>';
    } else {
      d.innerHTML = '<div class="pill"><i></i><span class="flag"></span><b></b>' + chip + '</div><div class="card"><div class="sub1"></div><div class="coord"></div><div class="info"></div><div class="meta"></div><div class="hint">Click to open</div></div>';
    }
    layer.appendChild(d);
    return d;
  }
  function fill(d, it) {
    d.querySelector('b').textContent = it.title;
    var c = d.querySelector('.chip');
    if (it.chip) { c.textContent = it.chip; c.style.display = ''; } else { c.style.display = 'none'; }
    var s = d.querySelector('.sub'); if (s) s.textContent = it.sub || '';
    var s1 = d.querySelector('.sub1'); if (s1) { s1.textContent = it.sub || ''; }
    var co = d.querySelector('.coord'); if (co) { co.textContent = it.coord || ''; co.style.display = it.coord ? '' : 'none'; }
    var inf = d.querySelector('.info'); if (inf) inf.textContent = it.info || '';
    var mt = d.querySelector('.meta'); if (mt) mt.textContent = it.meta ? 'Data: ' + it.meta : '';
    var fl = d.querySelector('.flag'); if (fl) { if (it.flag && FLAGS[it.flag]) { fl.style.backgroundImage = 'url("' + FLAGS[it.flag] + '")'; fl.style.display = 'block'; } else { fl.style.display = 'none'; } }
    d.classList.toggle('hot', !!it.hot);
  }

  function relax(sites) {
    // iki yana yerlesim + dikey ayirma (ust uste binmesin)
    var boxes = sites.map(function (s) {
      var d = nodes[s.id], w = d.offsetWidth || 150, h = d.offsetHeight || 26;
      var dx = s.x - s.cx, dy = s.y - s.cy, L = Math.hypot(dx, dy) || 1;
      var side = dx >= 0 ? 1 : -1;
      return { s: s, w: w, h: h, side: side, x: s.x + side * 34, y: s.y + (dy / L) * 22 };
    });
    for (var it = 0; it < 24; it++) {
      for (var i = 0; i < boxes.length; i++) for (var j = i + 1; j < boxes.length; j++) {
        var a = boxes[i], b = boxes[j];
        var ax = a.side > 0 ? a.x : a.x - a.w, bx = b.side > 0 ? b.x : b.x - b.w;
        if (ax < bx + b.w + 6 && bx < ax + a.w + 6 && Math.abs(a.y - b.y) < (a.h + b.h) / 2 + 4) {
          var push = ((a.h + b.h) / 2 + 4 - Math.abs(a.y - b.y)) / 2 + 0.5, dir = a.y <= b.y ? -1 : 1;
          a.y += dir * push; b.y -= dir * push;
        }
      }
      boxes.forEach(function (q) { q.y = Math.max(23, Math.min(innerHeight - q.h + 3, q.y)); });
    }
    return boxes;
  }

  window.feza = {
    set: function (data) {
      var items = (data && data.items) || [];
      if (data && data.map) {
        var fw = innerWidth - (data.map.strip || 0), aw = fw - 80, ah = innerHeight - 150;
        var mw = Math.max(200, Math.min(aw, 2 * ah)), mh = mw / 2, mx0 = (fw - mw) / 2, my0 = 104 + (ah - mh) / 2;
        data.map.x = mx0; data.map.y = my0; data.map.w = mw; data.map.h = mh; data.map.panel = [fw, innerHeight];
        items.forEach(function (q) {
          q.x = +(mx0 + (q.lon + 180) / 360 * mw).toFixed(1); q.y = +(my0 + (90 - q.lat) / 180 * mh).toFixed(1);
          q.cx = mx0 + mw / 2; q.cy = my0 + mh / 2;
        });
      }
      var seen = {};
      var sites = [];
      var lineHtml = '';
      items.forEach(function (it) {
        seen[it.id] = 1;
        var d = nodes[it.id] || (nodes[it.id] = mk(it));
        fill(d, it);
        if (it.kind === 'site') { sites.push(it); }
        else {
          var tx = it.x, ty = it.y - it.r - 12;
          var p = pos[it.id] || (pos[it.id] = { x: tx, y: ty });
          p.x += (tx - p.x) * 0.5; p.y += (ty - p.y) * 0.5;
          d.style.transform = 'translate(' + (p.x - d.offsetWidth / 2).toFixed(1) + 'px,' + (p.y - d.offsetHeight).toFixed(1) + 'px)';
          lineHtml += '<line x1="' + it.x + '" y1="' + (it.y - it.r) + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '"/>';
        }
        d.classList.add('on');
      });
      relax(sites.filter(function (s) { return nodes[s.id]; })).forEach(function (b) {
        var d = nodes[b.s.id], p = pos[b.s.id] || (pos[b.s.id] = { x: b.x, y: b.y });
        p.x += (b.x - p.x) * 0.45; p.y += (b.y - p.y) * 0.45;
        var left = b.side > 0 ? p.x : p.x - d.offsetWidth;
        left = Math.max(8, Math.min((data && data.map ? data.map.panel[0] : innerWidth) - d.offsetWidth - 8, left));
        d.style.transform = 'translate(' + left.toFixed(1) + 'px,' + (p.y - 13).toFixed(1) + 'px)';
        d.style.zIndex = b.s.hot ? 5 : 1;
        lineHtml += '<line x1="' + b.s.x + '" y1="' + b.s.y + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '"/>';
      });
      Object.keys(nodes).forEach(function (id) {
        if (!seen[id]) { nodes[id].classList.remove('on'); }
      });
      lines.innerHTML = lineHtml;
      var M = data && data.map;
      panel.style.display = mapEl.style.display = M ? 'block' : 'none';
      if (M) {
        panel.style.width = M.panel[0] + 'px'; panel.style.height = M.panel[1] + 'px';
        mapEl.style.left = M.x + 'px'; mapEl.style.top = M.y + 'px'; mapEl.style.width = M.w + 'px'; mapEl.style.height = M.h + 'px';
        var bg = "url('" + M.img + "')"; if (mapEl.dataset.bg !== bg) { mapEl.style.backgroundImage = bg; mapEl.dataset.bg = bg; }
      }
      Object.keys(dots).forEach(function (id) { if (!M || !seen[id]) { dots[id].remove(); delete dots[id]; } });
      if (M) { items.forEach(function (it) {
        var dt = dots[it.id];
        if (!dt) { dt = dots[it.id] = document.createElement('i'); dt.className = 'dot acc-' + it.accent; layer.appendChild(dt); }
        dt.classList.toggle('hot', !!it.hot);
        dt.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
      }); }
      if (data && data.toggle) {
        tgl.textContent = data.toggle; tgl.classList.add('on'); tgl.classList.toggle('hot', !!data.toggle_hot);
        tgl.style.top = (head.getBoundingClientRect().bottom + 10) + 'px';
      } else { tgl.classList.remove('on'); }
      var lay = [];
      if (data && data.toggle) { var tr = tgl.getBoundingClientRect(); lay.push({ id: 'toggle', x: tr.left, y: tr.top, w: tr.width, h: tr.height }); }
      Object.keys(nodes).forEach(function (id) {
        if (!seen[id] || nodes[id].classList.contains('body')) return;
        var r = nodes[id].getBoundingClientRect(), it2 = null;
        items.forEach(function (q) { if (q.id === id) it2 = q; });
        lay.push({ id: id, x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height), dx: it2 ? it2.x : 0, dy: it2 ? it2.y : 0 });
      });
      var ls = JSON.stringify([innerWidth, innerHeight, lay]);
      if (ls !== lastLay) { lastLay = ls; console.log('LAY|' + JSON.stringify({ W: innerWidth, H: innerHeight, r: lay })); }
      if (data && data.head) {
        head.className = 'acc-' + data.head.accent + ' on';
        head.querySelector('h1').textContent = data.head.title;
        head.querySelector('p').textContent = data.head.sub;
      } else { head.classList.remove('on'); }
    }
  };
})();
</script>
</body>
</html>
